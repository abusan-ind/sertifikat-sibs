<!--
  ============================================================================
  VERSI IFRAME RESPONSIVE (ALTERNATIF SIMPEL)
  ============================================================================
  Gunakan versi ini jika Anda ingin tampilan yang langsung merender web app 
  Apps Script di dalam iframe secara otomatis dan meneruskan parameter ?id=...
-->

<div style="max-width: 680px; margin: 20px auto; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-sizing: border-box;">
  
  <div style="text-align: center; margin-bottom: 16px;">
    <h2 style="margin: 0 0 6px 0; color: #0f172a; font-size: 24px;">Verifikasi Keaslian Sertifikat</h2>
    <p style="color: #64748b; font-size: 14px; margin: 0;">
      Periksa status penerbitan sertifikat resmi yang dikeluarkan oleh yayasan.
    </p>
  </div>

  <div style="background: #ffffff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; overflow: hidden;">
    <iframe 
      id="yysFrame" 
      src="about:blank" 
      title="Sistem Verifikasi Sertifikat Yayasan"
      style="display: block; width: 100%; height: 680px; border: none; background: #ffffff;"
      loading="lazy">
    </iframe>
  </div>

  <p style="font-size: 11px; text-align: center; color: #94a3b8; margin-top: 14px;">
    🔒 Sistem Verifikasi Registrasi Sertifikat Berbasis Database Resmi Yayasan.
  </p>
</div>

<script>
(function() {
  // GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA (akhiran /exec)
  var APP_URL = 'GANTI_DENGAN_URL_DEPLOYMENT_APPS_SCRIPT_ANDA';

  var params = new URLSearchParams(window.location.search);
  var certId = params.get('id') || params.get('cert') || '';

  var frame = document.getElementById('yysFrame');
  var targetUrl = APP_URL + (certId ? (APP_URL.includes('?') ? '&' : '?') + 'id=' + encodeURIComponent(certId) : '');
  
  frame.src = targetUrl;
})();
</script>
